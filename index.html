<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="javascript.js" defer></script>
</head>
<body>
    <div class="main">
        <div class="calculator">
            <div class="display"><span></span></div>

            <div class="display-buttons">
                    <div class="row1">
                        <button class="button control">AC</button>
                        <button class="button operators">^</button>
                        <button class="button operators">%</button>
                        <button class="button operators">/</button>
                    </div>

                    <div class="row2">
                        <button class="button digits">7</button>
                        <button class="button digits">8</button>
                        <button class="button digits">9</button>
                        <button class="button operators">*</button>
                    </div>

                    <div class="row3">
                        <button class="button digits">4</button>
                        <button class="button digits">5</button>
                        <button class="button digits">6</button>
                        <button class="button operators">-</button>
                    </div>

                    <div class="row4">
                        <button class="button digits">1</button>
                        <button class="button digits">2</button>
                        <button class="button digits">3</button>
                        <button class="button operators">+</button>
                    </div>

                    <div class="row5">
                        <button class="button control">C</button>
                        <button class="button digits">0</button>
                        <button class="button digits">.</button>
                        <button class="button evaluation">=</button>
                    </div>
            </div>

        </div>
    </div>
</body>
</html>
